name: Omi CLI config transaction validation

on:
  push:
    branches: [validation/omi-cli-22972-20261021]

permissions:
  contents: read

jobs:
  sdk:
    name: SDK / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: Windows Python 3.12, os: windows-latest, python: '3.12', id: windows312}
    defaults:
      run:
        shell: bash
        working-directory: source/sdks/python-cli
    env:
      OMI_CONFIG: ${{ github.workspace }}/omi-cli-validation/config.toml
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout validation package
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          path: ci-package
          persist-credentials: false
      - name: Checkout fixed public source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          repository: BasedHardware/omi
          ref: d6b734be95c367a1c5750d342ab2bee094d47265
          path: source
          fetch-depth: 1
          sparse-checkout: |
            sdks/python-cli
            docs/api-reference
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Verify and apply reviewed five-file patch
        working-directory: source
        run: |
          python - <<'PYCODE'
          import hashlib, os, subprocess
          from pathlib import Path
          package = Path(os.environ['GITHUB_WORKSPACE']) / 'ci-package'
          patch = package / 'changes.patch'
          raw_patch = subprocess.check_output(['git', '-C', str(package), 'cat-file', 'blob', 'HEAD:changes.patch'])
          patch.write_bytes(raw_patch)
          print('Raw Git patch SHA256:', hashlib.sha256(raw_patch).hexdigest())
          assert hashlib.sha256(patch.read_bytes()).hexdigest() == '76ce279408900ba2e716500cf8749b5f0bb006bdeed2892c61a9fdc6961d55f1'
          contract = Path('docs/api-reference/openapi.json')
          assert hashlib.sha256(contract.read_bytes()).hexdigest() == '9db4996476277363f8d2d3ce4b45a58c7919b5917cb7ef28ce94572a7b4933c8'
          PYCODE
          test "$(git rev-parse HEAD)" = 'd6b734be95c367a1c5750d342ab2bee094d47265'
          git config core.autocrlf false
          git apply --check ../ci-package/changes.patch
          git apply --index ../ci-package/changes.patch
          python - <<'PYCODE'
          import hashlib
          from pathlib import Path
          expected = {'sdks/python-cli/omi_cli/config.py': 'fce956f67c90d21c2eaf2a050cf66e11ed40b61e46fdac2e3406fc69d574d39b', 'sdks/python-cli/omi_cli/auth/store.py': '1f597e35f987d3de19b652d113e17d0327898eb75981c5c6d97021544de93099', 'sdks/python-cli/omi_cli/commands/config.py': 'af686c8f4c8fcd68e06f0c38fc99ea1ac8a16467114fce80c76b2b8aa7d75a19', 'sdks/python-cli/omi_cli/commands/local.py': '582405198354a5c49b3f0c1472c88fcdc85ad33415dbbfc90c79833fa8a50587', 'sdks/python-cli/tests/test_config_transactions.py': '4ce9bb78d60f1b052945f673aa771a3e901a17a81b15d8e349691e58ccd1aa27'}
          for name, digest in expected.items():
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual == digest, name
              print(f'{actual}  {name}')
          PYCODE
          git diff --cached --check
          git diff --cached --stat
      - name: Install SDK and declared test dependencies
        run: |
          python --version
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip list --format=freeze
      - name: Run the complete CLI suite with synthetic fixtures
        run: |
          python -m pytest -q -o addopts=--strict-markers --basetemp "${RUNNER_TEMP}/omi-cli-pytest-${{ matrix.id }}" --junitxml "${RUNNER_TEMP}/omi-cli-results.xml"
          python - <<'PYCODE'
          import json, os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = ET.parse(Path(os.environ['RUNNER_TEMP']) / 'omi-cli-results.xml').getroot()
          suites = list(root.iter('testsuite'))
          print('JUnit totals:', json.dumps({key: sum(int(s.get(key, 0)) for s in suites) for key in ('tests', 'failures', 'errors', 'skipped')}))
          PYCODE
