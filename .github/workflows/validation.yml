name: Omi CLI Windows lock validation
on:
  push:
    branches: [validation/omi-cli-lock-r109-20261031]
permissions:
  contents: read
jobs:
  windows:
    name: Windows Python 3.12 synthetic lock regression and full suite
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: source/sdks/python-cli
    env:
      OMI_CONFIG: ${{ github.workspace }}/omi-cli-validation/config.toml
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout validation package
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: ci-package
          persist-credentials: false
      - name: Checkout exact public PR base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          repository: ZhaZhaBei/omi
          ref: b42fe39968a86d4422760d5340da678764e09f2b
          path: source
          fetch-depth: 1
          sparse-checkout: |
            sdks/python-cli
            docs/api-reference
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify and apply exact patch
        working-directory: source
        run: |
          python - <<'PYCODE'
          import hashlib, os, subprocess
          from pathlib import Path
          package = Path(os.environ['GITHUB_WORKSPACE']) / 'ci-package'
          patch = package / 'changes.patch'
          patch.write_bytes(subprocess.check_output(['git', '-C', str(package), 'cat-file', 'blob', 'HEAD:changes.patch']))
          assert hashlib.sha256(patch.read_bytes()).hexdigest() == '69b83b3066131fd6bff94b31c6c4343ad167470bc0ccbf1e991ccd8939ebb97c'
          PYCODE
          test "$(git rev-parse HEAD)" = 'b42fe39968a86d4422760d5340da678764e09f2b'
          git config core.autocrlf false
          git apply --check ../ci-package/changes.patch
          git apply --index ../ci-package/changes.patch
          git diff --cached --check
      - name: Install declared test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run targeted Windows locks
        run: python -m pytest -q -o addopts=--strict-markers tests/test_windows_config_lock.py tests/test_config_transactions.py
      - name: Run complete CLI suite with synthetic fixtures
        run: python -m pytest -q -o addopts=--strict-markers --basetemp "${RUNNER_TEMP}/omi-cli-pytest" --junitxml "${RUNNER_TEMP}/omi-cli-results.xml"
