name: Omi CLI Linux lock validation
on:
  push:
    branches: [validation/omi-cli-lock-linux-r86-20261029]
permissions:
  contents: read
jobs:
  linux:
    name: Linux Python 3.12 lock regression and full suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: source/sdks/python-cli
    env:
      OMI_CONFIG: ${{ github.workspace }}/omi-cli-validation/config.toml
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout validation package
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: ci-package
          persist-credentials: false
      - name: Checkout exact public PR base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          repository: ZhaZhaBei/omi
          ref: 7a1bacdb5b0217e24e04279dec913a39c2b28770
          path: source
          fetch-depth: 1
          sparse-checkout: |
            sdks/python-cli
            docs/api-reference
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify and apply exact patch
        working-directory: source
        run: |
          python - <<'PYCODE'
          import hashlib, os, subprocess
          from pathlib import Path
          package = Path(os.environ['GITHUB_WORKSPACE']) / 'ci-package'
          patch = package / 'changes.patch'
          patch.write_bytes(subprocess.check_output(['git', '-C', str(package), 'cat-file', 'blob', 'HEAD:changes.patch']))
          assert hashlib.sha256(patch.read_bytes()).hexdigest() == '4799f8d94a0a1eecd383922d38fce19b1881afae010cda4486497915855e4d25'
          PYCODE
          test "$(git rev-parse HEAD)" = '7a1bacdb5b0217e24e04279dec913a39c2b28770'
          git config core.autocrlf false
          git apply --check ../ci-package/changes.patch
          git apply --index ../ci-package/changes.patch
          git diff --cached --check
      - name: Install declared test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Check formatting
        run: python -m black --check omi_cli/config.py tests/test_windows_config_lock.py
      - name: Compare default mypy diagnostics against exact base
        run: |
          cp omi_cli/config.py "$RUNNER_TEMP/config-candidate.py"
          set +e
          python -m mypy --no-incremental omi_cli > "$RUNNER_TEMP/mypy-candidate.log" 2>&1
          candidate_exit=$?
          git show HEAD:sdks/python-cli/omi_cli/config.py > omi_cli/config.py
          python -m mypy --no-incremental omi_cli > "$RUNNER_TEMP/mypy-base.log" 2>&1
          base_exit=$?
          cp "$RUNNER_TEMP/config-candidate.py" omi_cli/config.py
          set -e
          cat "$RUNNER_TEMP/mypy-candidate.log"
          echo "candidate_mypy_exit=$candidate_exit baseline_mypy_exit=$base_exit"
          python - <<'PYCODE'
          import os, re
          from collections import Counter
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          pattern = re.compile(r'^(.*?):\d+(?::\d+)?: (error|note): (.*)$')
          def diagnostics(path):
              out = []
              for line in path.read_text(encoding='utf-8').splitlines():
                  match = pattern.match(line)
                  if match and match.group(2) == 'error':
                      out.append((match.group(1), match.group(3)))
              return Counter(out)
          baseline = diagnostics(temp / 'mypy-base.log')
          candidate = diagnostics(temp / 'mypy-candidate.log')
          print('baseline_errors=', sum(baseline.values()), 'candidate_errors=', sum(candidate.values()))
          assert baseline == candidate, f'New or changed diagnostics: {candidate - baseline}'
          PYCODE
      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir "${RUNNER_TEMP}/omi-wheel"
      - name: Run targeted lock regression
        run: python -m pytest -q -o addopts=--strict-markers tests/test_windows_config_lock.py tests/test_config_transactions.py
      - name: Run complete CLI suite with synthetic fixtures
        run: python -m pytest -q -o addopts=--strict-markers --basetemp "${RUNNER_TEMP}/omi-cli-pytest" --junitxml "${RUNNER_TEMP}/omi-cli-results.xml"
      - name: Check types with documented compatibility dependencies
        run: |
          python -m pip install 'click==8.1.8' 'tomli==2.5.0'
          python -m mypy --no-incremental omi_cli
