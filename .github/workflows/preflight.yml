name: Omi CLI lock review preflight
on:
  push:
    branches: [validation/omi-r109-linux-preflight-20261030]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_NO_LAZY_FETCH: '1'
    steps:
      - name: Checkout validation package
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: ci-package
          persist-credentials: false
      - name: Checkout exact public PR base with history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ZhaZhaBei/omi
          ref: b42fe39968a86d4422760d5340da678764e09f2b
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Create isolated preflight environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/preflight-venv"
          "$RUNNER_TEMP/preflight-venv/bin/python" -m pip install --only-binary=:all: 'PyYAML==6.0.1' 'python-dotenv==1.2.2'
      - name: Verify source, metadata and apply patch
        shell: bash
        working-directory: source
        run: |
          python - <<'PYCODE'
          import hashlib, os, subprocess
          from pathlib import Path
          package = Path(os.environ['GITHUB_WORKSPACE']) / 'ci-package'
          patch = package / 'changes.patch'
          assert hashlib.sha256(patch.read_bytes()).hexdigest() == '69b83b3066131fd6bff94b31c6c4343ad167470bc0ccbf1e991ccd8939ebb97c'
          assert hashlib.sha256((package / 'pr-body.md').read_bytes()).hexdigest() == '3f4cebd898338973e1142ba40e16c9b81a00dd2754977e03e4a5690c4a649011'
          PYCODE
          test "$(git rev-parse HEAD)" = 'b42fe39968a86d4422760d5340da678764e09f2b'
          git fetch --no-tags https://github.com/BasedHardware/omi.git main:refs/remotes/origin/main
          git apply --check ../ci-package/changes.patch
          git apply --index ../ci-package/changes.patch
          git diff --cached --check
          git -c user.name=ZhaZhaBei -c user.email=203745378+ZhaZhaBei@users.noreply.github.com commit -m 'test: synchronize config lock tests without polling'
          git diff --name-only HEAD^ HEAD
      - name: Suggest PR metadata
        shell: bash
        working-directory: source
        run: |
          export PYTHON="$RUNNER_TEMP/preflight-venv/bin/python"
          export OMI_PR_BODY_FILE="$GITHUB_WORKSPACE/ci-package/pr-body.md"
          scripts/pr-preflight --suggest
      - name: Run project preflight
        shell: bash
        working-directory: source
        run: |
          export PYTHON="$RUNNER_TEMP/preflight-venv/bin/python"
          export OMI_PR_BODY_FILE="$GITHUB_WORKSPACE/ci-package/pr-body.md"
          make preflight
      - name: Validate proposed PR metadata
        shell: bash
        working-directory: source
        run: |
          export PYTHON="$RUNNER_TEMP/preflight-venv/bin/python"
          scripts/pr-preflight --pr-body-file "$GITHUB_WORKSPACE/ci-package/pr-body.md"
